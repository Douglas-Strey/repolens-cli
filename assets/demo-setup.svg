<svg xmlns="http://www.w3.org/2000/svg" width="813" height="364" viewBox="0 0 813 364" role="img" aria-label="Terminal output of repolens setup --dry-run">
  <rect width="813" height="364" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect width="813" height="32" rx="10" fill="#161b22"/>
  <rect y="22" width="813" height="10" fill="#161b22"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="16" r="6" fill="#febc2e"/>
  <circle cx="60" cy="16" r="6" fill="#28c840"/>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
    <text x="20" y="62" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3" font-weight="700">repolens setup --dry-run</tspan></text>
    <text x="20" y="82" xml:space="preserve"></text>
    <text x="20" y="102" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">Setup plan</tspan><tspan fill="#e6edf3"> for </tspan><tspan fill="#e6edf3" font-weight="700">acme</tspan></text>
    <text x="20" y="122" xml:space="preserve"></text>
    <text x="20" y="142" xml:space="preserve"><tspan fill="#e6edf3">  1. </tspan><tspan fill="#39c5cf">cp .env.example .env</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">create your local environment file</tspan></text>
    <text x="20" y="162" xml:space="preserve"><tspan fill="#e6edf3">     </tspan><tspan fill="#8b949e">·</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#8b949e">Then fill in your own values: the file starts as a copy of .env.example.</tspan></text>
    <text x="20" y="182" xml:space="preserve"><tspan fill="#e6edf3">  2. </tspan><tspan fill="#39c5cf">pnpm install        </tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">install dependencies</tspan></text>
    <text x="20" y="202" xml:space="preserve"><tspan fill="#e6edf3">     </tspan><tspan fill="#8b949e">·</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#8b949e">Runs these scripts from the repository:</tspan></text>
    <text x="20" y="222" xml:space="preserve"><tspan fill="#e6edf3">       </tspan><tspan fill="#8b949e">postinstall (apps/web/package.json): nuxt prepare</tspan></text>
    <text x="20" y="242" xml:space="preserve"><tspan fill="#e6edf3">     </tspan><tspan fill="#8b949e">·</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#8b949e">Dependencies may run install scripts too; --ignore-scripts skips them all.</tspan></text>
    <text x="20" y="262" xml:space="preserve"></text>
    <text x="20" y="282" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">Skipped</tspan></text>
    <text x="20" y="302" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">·</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#39c5cf">pnpm db:up</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">a project script starts the services</tspan></text>
    <text x="20" y="322" xml:space="preserve"></text>
    <text x="20" y="342" xml:space="preserve"><tspan fill="#8b949e">Dry run: nothing was run.</tspan></text>
  </g>
</svg>
