    <text x="20" y="162" xml:space="preserve"><tspan fill="#e6edf3">  Type             Monorepo · 4 packages (pnpm workspaces, Turborepo)</tspan></text>
    <text x="20" y="182" xml:space="preserve"><tspan fill="#e6edf3">  Languages        TypeScript 63% </tspan><tspan fill="#8b949e">·</tspan><tspan fill="#e6edf3"> Vue 25% </tspan><tspan fill="#8b949e">·</tspan><tspan fill="#e6edf3"> Go 13%</tspan></text>
    <text x="20" y="202" xml:space="preserve"><tspan fill="#e6edf3">  Package manager  pnpm 10.17.1</tspan></text>
    <text x="20" y="222" xml:space="preserve"><tspan fill="#e6edf3">  Runtimes         Node.js 22 </tspan><tspan fill="#8b949e">·</tspan><tspan fill="#e6edf3"> Go 1.25</tspan></text>
    <text x="20" y="242" xml:space="preserve"><tspan fill="#e6edf3">  Entry points     services/billing</tspan></text>
