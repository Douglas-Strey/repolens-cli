services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: REPOLENS_FIXTURE_SECRET_pg
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: REPOLENS_FIXTURE_SECRET_minio_user
      MINIO_ROOT_PASSWORD: REPOLENS_FIXTURE_SECRET_minio_pw
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
