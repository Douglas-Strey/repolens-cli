    <text x="20" y="82" xml:space="preserve"></text>
    <text x="20" y="102" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">RepoLens</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#8b949e">·</tspan><tspan fill="#e6edf3"> acme</tspan></text>
    <text x="20" y="122" xml:space="preserve"></text>
