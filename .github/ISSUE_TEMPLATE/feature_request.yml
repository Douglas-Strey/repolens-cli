name: Feature request
description: Suggest an improvement to RepoLens.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation where RepoLens fell short, not just the feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like RepoLens to do?
      description: Example output is very welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: principles
    attributes:
      label: Fits the project principles
      options:
        - label: It works with static analysis only (no running project code, no network access).
          required: true
