version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Sample projects RepoLens scans, some broken on purpose (an invalid package.json).
    exclude-paths:
      - "test/fixtures/**"
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
