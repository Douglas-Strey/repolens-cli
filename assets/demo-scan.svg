    <text x="20" y="562" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">1.</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#39c5cf">pnpm db:up</tspan><tspan fill="#e6edf3">    </tspan><tspan fill="#8b949e">start local services</tspan></text>
