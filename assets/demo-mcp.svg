<svg xmlns="http://www.w3.org/2000/svg" width="813" height="624" viewBox="0 0 813 624" role="img" aria-label="Terminal output of repolens mcp">
  <rect width="813" height="624" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect width="813" height="32" rx="10" fill="#161b22"/>
  <rect y="22" width="813" height="10" fill="#161b22"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="16" r="6" fill="#febc2e"/>
  <circle cx="60" cy="16" r="6" fill="#28c840"/>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
    <text x="20" y="62" xml:space="preserve"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3" font-weight="700">repolens mcp</tspan></text>
    <text x="20" y="82" xml:space="preserve"></text>
    <text x="20" y="102" xml:space="preserve"><tspan fill="#8b949e"># Started by your MCP client. The assistant calls a tool:</tspan></text>
    <text x="20" y="122" xml:space="preserve"><tspan fill="#39c5cf">→</tspan><tspan fill="#e6edf3"> tools/call </tspan><tspan fill="#e6edf3" font-weight="700">get_services</tspan></text>
    <text x="20" y="142" xml:space="preserve"><tspan fill="#39c5cf">←</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#8b949e">and reads the answer:</tspan></text>
    <text x="20" y="162" xml:space="preserve"></text>
    <text x="20" y="182" xml:space="preserve"><tspan fill="#e6edf3"># acme</tspan></text>
    <text x="20" y="202" xml:space="preserve"></text>
    <text x="20" y="222" xml:space="preserve"><tspan fill="#e6edf3">## Services</tspan></text>
    <text x="20" y="242" xml:space="preserve"></text>
    <text x="20" y="262" xml:space="preserve"><tspan fill="#e6edf3">Docker Compose: `docker-compose.yml`. Start the services with `pnpm db:up`.</tspan></text>
    <text x="20" y="282" xml:space="preserve"></text>
    <text x="20" y="302" xml:space="preserve"><tspan fill="#e6edf3">| Service | Image / build | Ports | Depends on | Kind |</tspan></text>
    <text x="20" y="322" xml:space="preserve"><tspan fill="#e6edf3">| --- | --- | --- | --- | --- |</tspan></text>
    <text x="20" y="342" xml:space="preserve"><tspan fill="#e6edf3">| `minio` | `minio/minio` | 9000 → 9000, 9001 → 9001 | – | storage · MinIO |</tspan></text>
    <text x="20" y="362" xml:space="preserve"><tspan fill="#e6edf3">| `postgres` | `postgres:17` | 5432 → 5432 | – | database · PostgreSQL |</tspan></text>
    <text x="20" y="382" xml:space="preserve"><tspan fill="#e6edf3">| `redis` | `redis:8` | 6379 → 6379 | – | cache · Redis |</tspan></text>
    <text x="20" y="402" xml:space="preserve"></text>
    <text x="20" y="422" xml:space="preserve"><tspan fill="#e6edf3">_Ports are `host → container`; "internal" ports are only reachable from other containers._</tspan></text>
    <text x="20" y="442" xml:space="preserve"></text>
    <text x="20" y="462" xml:space="preserve"><tspan fill="#e6edf3">## Databases</tspan></text>
    <text x="20" y="482" xml:space="preserve"></text>
    <text x="20" y="502" xml:space="preserve"><tspan fill="#e6edf3">| Database | Kind | Detected via | Confidence |</tspan></text>
    <text x="20" y="522" xml:space="preserve"><tspan fill="#e6edf3">| --- | --- | --- | --- |</tspan></text>
    <text x="20" y="542" xml:space="preserve"><tspan fill="#e6edf3">| PostgreSQL | relational | Docker, config, env | high |</tspan></text>
    <text x="20" y="562" xml:space="preserve"><tspan fill="#e6edf3">| Redis | key-value | Docker, env | high |</tspan></text>
    <text x="20" y="582" xml:space="preserve"></text>
    <text x="20" y="602" xml:space="preserve"><tspan fill="#e6edf3">ORMs and query builders: Prisma 6.16.2 (`apps/api`).</tspan></text>
  </g>
</svg>
